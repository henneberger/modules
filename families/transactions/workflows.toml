schema_version = 1

[family]
name = "transactions"
version = "1.0.0"
description = "Typed resource protocols for local transactions"

[publisher]
name = "interfaces"

[[interfaces]]
id = "transactions.workflow"
version = "1"
types = []

[interfaces.callables]
run = { parameters = [{name = "key", kind = "POSITIONAL_OR_KEYWORD", required = true}, {name = "value", kind = "POSITIONAL_OR_KEYWORD", required = true}], asynchronous = false }

[interfaces.typing.types]
Text = { id = "python.str", usage = "shared", representation = "str" }

[interfaces.typing.operations]
run = { parameters = {key = {type = "Text", mode = "share"}, value = {type = "Text", mode = "share"}}, returns = ["Text", "Text"], effects = ["sqlite"] }
