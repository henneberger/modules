schema_version = 1

[publisher]
name = "mari"

[family]
description = "Reusable algorithms and support types adapted from the copied Mari project."
name = "mari"
version = "0.1.0"

[source]
license_files = ["../../projects/mari-kit/LICENSE.md", "../../projects/mari-kit/THIRD_PARTY_NOTICES.md"]
package = "mark_kit"
root = "../../projects/mari-kit/src"

[discovery]
include = ["**/*.py"]
public = true

[context]
guide = "../../projects/mari-kit/docs/algorithm-choices.md"
selection_guidance = ["Inspect source assumptions and shared types before composing implementations.", "Unknown effects require characterization; shared family membership is not substitutability."]
solves = ["Retrieve, rank, organize, and evaluate evidence and agent memory."]

[external_dependencies]
graspologic_native = "graspologic-native>=1.2"
networkx = "networkx>=3.2"
numpy = "numpy>=1.26"
pcst_fast = "pcst-fast>=1.0.10"
rdflib = "rdflib"
scipy = "scipy>=1.11"
torch = "torch"
torch_geometric = "torch-geometric"

[dynamic_dependencies]
"mark_kit.algorithms.graphs:_dependency" = []
"mark_kit.algorithms.graphs:_nx_graph" = ["networkx>=3.2"]
"mark_kit.algorithms.graphs:hierarchical_leiden_partition" = ["graspologic-native>=1.2"]
"mark_kit.algorithms.graphs:prize_collecting_forest" = ["pcst-fast>=1.0.10"]
"mark_kit.algorithms.linkage:centroid_clusters" = ["scipy>=1.11"]

[contributions]
include = ["members/**/*.toml"]
