schema_version = 1

[family]
name = "transactions"
version = "1.0.0"
description = "Typed resource protocols for local transactions"

[publisher]
name = "builder"

[module]
id = "scoped_write_read"
version = "1.0.0"
provides = "transactions.write_read@1"
summary = "Borrow a transaction for reads and writes, commit on return, abort on failure"

[ports]
store = "transactions.store@1"

[program]
source = "scoped.mfl"
export = "run"

[policy]
allowed_effects = ["sqlite"]
