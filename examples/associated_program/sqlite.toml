schema_version = 1

[family]
name = "typed-knowledge"
version = "1.0.0"
description = "Generic checked SQLite knowledge-base search"

[publisher]
name = "systems"

[module]
id = "sqlite_search"
version = "1.0.0"
provides = "kb.generic.search@1"
summary = "Compose query preparation and SQLite FTS5 into a knowledge-base search"

[nodes.prepare]
use = "typed-knowledge/sqlite.phrase"

[nodes.index]
use = "typed-knowledge/sqlite.fts"

[nodes.search]
use = "typed-knowledge/programs.search"
with = { prepare = "prepare", index = "index" }

[exports]
search = "search.search"

[associated.types]
DocumentId = "search.DocumentId"

[policy]
allowed_effects = ["sqlite"]
