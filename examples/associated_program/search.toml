schema_version = 1

[family]
name = "typed-knowledge"
version = "1.0.0"
description = "Generic checked SQLite knowledge-base search"

[publisher]
name = "programs"

[module]
id = "search"
version = "1.0.0"
provides = "kb.generic.search@1"
summary = "Prepare a query and search an index with matching query syntax"
capabilities = ["citation-search"]

[ports]
prepare = "kb.generic.query@1"
index = "kb.generic.index@1"

[associated]
sharing = [["prepare.QuerySyntax", "index.QuerySyntax"]]
types.DocumentId = "index.DocumentId"

[program]
source = "search.mfl"
export = "search"

[policy]
allowed_effects = ["sqlite"]
