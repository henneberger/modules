schema_version = 1

[family]
name = "typed-knowledge"
version = "1.0.0"
description = "Generic checked SQLite knowledge-base search"

[publisher]
name = "systems"

[module]
id = "sqlite_phrase_search"
version = "1.0.0"
provides = "kb.generic.search@1"
summary = "Require SQLite phrase-query syntax when linking the search index"

[ports]
index = "kb.generic.index@1"

[nodes.prepare]
use = "typed-knowledge/sqlite.phrase"

[nodes.search]
use = "typed-knowledge/programs.search"
with.prepare = "prepare"

[nodes.search.with.index]
module = "index"
where.QuerySyntax = { nominal = "sqlite.fts5.phrase-query.v1", kind = "identity" }

[exports]
search = "search.search"

[associated.types]
DocumentId = "search.DocumentId"

[policy]
allowed_effects = ["sqlite"]
