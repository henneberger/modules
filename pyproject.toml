[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "module-families"
version = "0.5.0"
description = "TOML-driven builds for reusable Python module families and agent-readable dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["packaging>=24.0"]

[project.scripts]
mf = "module_families.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
module_families = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
